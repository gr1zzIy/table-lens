name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TableLens.sln

      - name: Build
        run: dotnet build TableLens.sln -c Release --no-restore

      - name: Test core and real Avalonia controls
        run: dotnet test tests/TableLens.Tests/TableLens.Tests.csproj -c Release --no-build --results-directory tests/TableLens.Tests/TestResults -- --report-trx --report-trx-filename tests.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
